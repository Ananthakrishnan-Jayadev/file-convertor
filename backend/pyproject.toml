[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-converter"
version = "0.1.0"
description = "Convert files between formats and shrink them to a size limit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=11.2",
    "pillow-heif>=0.18",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "odfpy>=1.4",
    "pymupdf>=1.24",
    "pdf2docx>=0.5.8",
    "pyyaml>=6.0",
    "xmltodict>=0.13",
    "markdown>=3.6",
    "markdownify>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
fileconvert = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
