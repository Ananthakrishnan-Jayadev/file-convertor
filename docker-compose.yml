# File Converter on a home server, reachable on your Wi-Fi at http://<server-ip>:<FC_PORT>.
# It has no login: keep it on your home network (don't forward this port on the router).
# Setup and updates: deploy/README.md.
services:
  fileconvert:
    build: .
    image: fileconvert:local
    container_name: fileconvert
    restart: unless-stopped
    # Runs as your user, so files in ./data stay yours (set in .env; 1000 is the first
    # user on Ubuntu).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # 8000 is taken by Job Radar on the server, so this app uses 8010 unless .env says otherwise.
      - "${FC_PORT:-8010}:8000"
    environment:
      TZ: America/Toronto
      # LibreOffice wants a writable home folder; the app gives each run its own profile anyway.
      HOME: /tmp
      FC_DATA_DIR: /data
      FC_JOB_TTL: "3600"
      FC_MAX_UPLOAD_MB: ${FC_MAX_UPLOAD_MB:-500}
      # Conversions at the same time. An old laptop is happiest with 2.
      FC_WORKERS: ${FC_WORKERS:-2}
    volumes:
      # Uploads, results and the job database. Files are deleted after an hour; the job
      # list survives restarts and updates.
      - ./data:/data
